<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Facebook Lead Monitor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Facebook Lead Monitor</h1>

  <!-- Monitoring -->
  <div class="card">
    <div id="monitor-state" class="state stopped">○ Зупинено</div>
    <div id="monitor-details" class="details"></div>
  </div>
  <div id="monitor-alert" class="alert"></div>
  <div class="row">
    <button id="start" class="primary">▶ Старт</button>
    <button id="stop" class="danger">■ Стоп</button>
  </div>
  <div id="monitor-message" class="message"></div>

  <!-- Settings -->
  <details id="settings-section">
    <summary>Налаштування</summary>

    <label for="token">Токен (EXTENSION_TOKEN з .env)</label>
    <input id="token" type="password" autocomplete="off">

    <label for="port">Порт локального сервера</label>
    <input id="port" type="number" min="1024" max="65535">

    <label for="groups">Групи для моніторингу</label>
    <textarea id="groups" placeholder="https://www.facebook.com/groups/123456789/"></textarea>
    <div class="hint">Одне посилання на рядок. Ви маєте бути учасником цих груп.</div>

    <div class="row">
      <button id="save" class="primary">Зберегти</button>
      <button id="check">Перевірити з'єднання</button>
    </div>
    <div id="status" class="message"></div>
  </details>

  <!-- Debug -->
  <details>
    <summary>Тест розбору</summary>
    <div class="row">
      <button id="parse-tab">Розібрати відкриту вкладку</button>
    </div>
    <div class="row">
      <button id="diagnose-tab">Скопіювати діагностику</button>
    </div>
    <div class="row">
      <button id="parse-profile">Розібрати відкритий профіль</button>
    </div>
    <div class="hint">Відкрийте групу у вкладці й натисніть. Нічого не надсилається.</div>
    <pre id="preview"></pre>
  </details>

  <script type="module" src="popup.js"></script>
</body>
</html>
